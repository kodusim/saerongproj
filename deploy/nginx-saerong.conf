# /etc/nginx/sites-enabled/default
#
# saerong.com → uvicorn 127.0.0.1:8000
#

upstream saerong_app {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    server_name www.saerong.com saerong.com;
    server_tokens off;
    client_max_body_size 20M;

    location / {
        proxy_pass http://saerong_app;
        proxy_redirect off;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # TDM 추론 요청의 응답 대기 시간
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # collectstatic 이 없으므로 저장소의 static/ 을 그대로 서빙한다.
    # no-cache = 매번 재검증(변경 없으면 304). JS 가 ES 모듈이라 캐시가 남으면
    # 옛 모듈과 새 모듈이 섞여 깨질 수 있어서 장기 캐시를 걸지 않는다.
    location /static {
        alias /srv/course-repo/static;
        add_header Cache-Control "no-cache";
    }

    location /media { alias /srv/course-repo/mediafiles; }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/saerong.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/saerong.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    server_name www.saerong.com saerong.com;
    listen 80;
    return 301 https://$host$request_uri;
}
