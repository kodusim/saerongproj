# /etc/nginx/sites-enabled/default
#
# saerong.com → uvicorn 127.0.0.1:8000
#
# WebSocket 을 위해 proxy_http_version 1.1 + Upgrade 헤더가 필요하다.
# $connection_upgrade 는 deploy/nginx-websocket.conf (http 컨텍스트) 에서 정의한다.

upstream saerong_app {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    server_name www.saerong.com saerong.com;
    server_tokens off;
    client_max_body_size 20M;

    location / {
        proxy_pass http://saerong_app;
        proxy_redirect off;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 채팅 WebSocket 이 유휴 상태로 끊기지 않도록 넉넉하게
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /static { alias /srv/staticfiles; }
    location /media  { alias /srv/course-repo/mediafiles; }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/saerong.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/saerong.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    server_name www.saerong.com saerong.com;
    listen 80;
    return 301 https://$host$request_uri;
}

