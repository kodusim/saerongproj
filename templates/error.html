<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ status_code }} — saerong.com</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif;
            background: #f6f7f9; color: #1a1d21;
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: 24px; text-align: center;
        }
        .code { font-size: 56px; font-weight: 700; letter-spacing: -2px; color: #9ca3af; }
        .msg { margin-top: 10px; font-size: 16px; }
        .home { margin-top: 26px; display: inline-block; font-size: 14px; color: #6b7280; }
        @media (prefers-color-scheme: dark) {
            body { background: #16181d; color: #e5e7eb; }
            .code { color: #4b5563; }
            .home { color: #9ca3af; }
        }
    </style>
</head>
<body>
    <div>
        <div class="code">{{ status_code }}</div>
        <div class="msg">{{ detail }}</div>
        <a class="home" href="/">← saerong.com</a>
    </div>
</body>
</html>
