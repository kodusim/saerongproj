<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>saerong.com</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif;
            background: #f6f7f9;
            color: #1a1d21;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .wrap { width: 100%; max-width: 640px; }
        h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
        .sub { margin-top: 8px; color: #6b7280; font-size: 15px; }
        .cards { margin-top: 32px; display: grid; gap: 14px; }
        .card {
            display: block;
            padding: 22px 24px;
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            text-decoration: none;
            color: inherit;
            transition: border-color .15s, transform .15s;
        }
        .card:hover { border-color: #9ca3af; transform: translateY(-2px); }
        .card h2 { font-size: 17px; font-weight: 600; }
        .card p { margin-top: 6px; color: #6b7280; font-size: 14px; line-height: 1.5; }
        footer { margin-top: 36px; color: #9ca3af; font-size: 13px; }

        @media (prefers-color-scheme: dark) {
            body { background: #16181d; color: #e5e7eb; }
            .card { background: #1f2228; border-color: #333840; }
            .card:hover { border-color: #565d68; }
            .sub, .card p, footer { color: #9ca3af; }
        }
        @media (max-width: 480px) {
            h1 { font-size: 23px; }
            .card { padding: 18px 20px; }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <h1>saerong.com</h1>
        <p class="sub">운영 중인 서비스</p>

        <div class="cards">
            <a class="card" href="/tdmprediction/">
                <h2>TDM 농도 예측</h2>
                <p>반코마이신 혈중 농도 하이브리드(ML + DL) 예측 — 연구·참고용</p>
            </a>
            <a class="card" href="/work/">
                <h2>Work</h2>
                <p>실시간 채팅 · 게시판</p>
            </a>
            <a class="card" href="/bltest/">
                <h2>bltest</h2>
                <p>소설 연재 플랫폼 — 프로토타입</p>
            </a>
        </div>

        <footer>&copy; 2026 saerong.com</footer>
    </div>
</body>
</html>
