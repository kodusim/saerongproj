<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TDM 예측 — 로그인</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/tdm-login.css">
</head>
<body>
  <div class="box">
    <h1>Vancomycin TDM</h1>
    <div class="sub">하이브리드 ML+DL 농도 예측 · 특허 출원 알고리즘</div>
    <form method="post">
      <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token(request) }}">
      <label for="username">아이디</label>
      <input type="text" id="username" name="username" autocomplete="username" required autofocus>
      <label for="password">비밀번호</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
      <button type="submit">로그인</button>
      {% if err %}<div class="err">{{ err }}</div>{% endif %}
    </form>
    <div class="foot">
      Two-stage Hybrid Model (ML + Sequence DL)<br>
      Patent pending · saerong.com
    </div>
  </div>
</body>
</html>
