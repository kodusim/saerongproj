<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>읽기 — bltest</title>
<link rel="stylesheet" href="/static/css/bl.css">
</head>
<body data-series-id="{{ series_id }}" data-no="{{ no }}">
<div class="bl-reader">

    <div id="content"></div>

    <div class="bl-reader-bar">
        <button class="bl-btn small" type="button" data-act="prev">← 이전</button>
        <a class="bl-btn small" id="to-series" href="/bltest/s/{{ series_id }}">목록</a>
        <button class="bl-btn small" type="button" data-act="next">다음 →</button>
        <span class="bl-spacer"></span>
        <button class="bl-btn small" type="button" data-act="size-down">가</button>
        <button class="bl-btn small" type="button" data-act="size-up">가+</button>
        <select class="bl-select bl-btn small" id="theme" style="width:auto">
            <option value="light">밝게</option>
            <option value="sepia">세피아</option>
            <option value="dark">어둡게</option>
        </select>
    </div>

</div>
<script type="module" src="/static/js/bl/viewer.js"></script>
</body>
</html>
