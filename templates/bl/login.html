<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 — 알카포스트</title>
<link rel="stylesheet" href="/static/css/bl.css">
</head>
<body>
<div class="bl-narrow">

    <div class="bl-head" style="justify-content:center; border-bottom:none">
        <a class="bl-logo" href="/bltest/">
            <picture>
                <source srcset="/static/img/logo-dark.png" media="(prefers-color-scheme: dark)">
                <img src="/static/img/logo.png" alt="ARCApost">
            </picture>
        </a>
    </div>

    <div class="bl-panel">
        <h2>작가 로그인</h2>

        <form method="post" action="/bltest/login">
            <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token(request) }}">

            <div class="bl-field">
                <label class="bl-label" for="username">아이디</label>
                <input type="text" class="bl-input" id="username" name="username"
                       autocomplete="username" required autofocus>
            </div>

            <div class="bl-field">
                <label class="bl-label" for="password">비밀번호</label>
                <input type="password" class="bl-input" id="password" name="password"
                       autocomplete="current-password" required>
            </div>

            {% if err %}
            <div class="bl-notice warn"><b>{{ err }}</b></div>
            {% endif %}

            <button class="bl-btn primary" type="submit" style="width:100%">로그인</button>
        </form>

        <p class="bl-help">
            회원가입은 없습니다. 계정은 운영자가 직접 부여합니다.
        </p>
    </div>

    <div class="bl-notice">
        읽기는 로그인 없이도 됩니다. <a href="/bltest/">작품 둘러보기</a>
    </div>

</div>
</body>
</html>
