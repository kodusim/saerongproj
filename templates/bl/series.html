<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>작품 — bltest</title>
<link rel="stylesheet" href="/static/css/bl.css">
</head>
<body data-series-id="{{ series_id }}">
<div class="bl-wrap">

    <div class="bl-head">
        <a class="bl-logo" href="/bltest/">bl<span>test</span></a>
        <span class="bl-spacer"></span>
        <a class="bl-btn" href="/bltest/write">작가 서재</a>
    </div>

    <div id="content"></div>

</div>

<!-- 신고 -->
<div class="bl-modal" id="report-modal">
    <div class="bl-modal-box">
        <h2>신고하기</h2>
        <div class="bl-field">
            <label class="bl-label" for="report-reason">사유</label>
            <select class="bl-select" id="report-reason">
                <option value="minor">미성년자 성적 묘사</option>
                <option value="nonconsent">동의 없는 성적 콘텐츠</option>
                <option value="realperson">실존 인물 대상</option>
                <option value="copyright">저작권 침해</option>
                <option value="rating">등급 표기 오류</option>
                <option value="etc">기타</option>
            </select>
        </div>
        <div class="bl-field">
            <label class="bl-label" for="report-detail">상세 내용</label>
            <textarea class="bl-textarea" id="report-detail"
                      placeholder="어떤 부분이 문제인지 적어주세요."></textarea>
        </div>
        <div class="bl-modal-actions">
            <button class="bl-btn" type="button" data-act="report-cancel">취소</button>
            <button class="bl-btn danger" type="button" data-act="report-send">신고</button>
        </div>
    </div>
</div>

<script type="module" src="/static/js/bl/series.js"></script>
</body>
</html>
