<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>알카포스트 — BL 소설 연재</title>
<link rel="stylesheet" href="/static/css/bl.css">
</head>
<body>
<div class="bl-wrap">

    <div class="bl-head">
        <a class="bl-logo" href="/bltest/">
            <picture>
                <source srcset="/static/img/logo-dark.png" media="(prefers-color-scheme: dark)">
                <img src="/static/img/logo.png" alt="ARCApost">
            </picture>
        </a>
        <span class="bl-spacer"></span>
        {% if user %}
        <span class="bl-user"><b>{{ user }}</b> 님</span>
        <a class="bl-btn primary" href="/bltest/write">작가 서재</a>
        <a class="bl-btn small" href="/bltest/logout">로그아웃</a>
        {% else %}
        <a class="bl-btn primary" href="/bltest/login">로그인</a>
        {% endif %}
    </div>

    <div class="bl-notice">
        연재 플랫폼 <b>프로토타입</b>입니다. 읽기는 로그인 없이 누구나 할 수 있고,
        글쓰기는 <b>운영자가 부여한 계정</b>으로만 됩니다. 연령 확인 수단이 없어
        <b>전체이용가 · 15세</b> 작품만 등록할 수 있습니다.
    </div>

    <div class="bl-toolbar">
        <input type="text" class="bl-input" id="q" placeholder="작품 제목 검색">
        <select class="bl-select" id="sort">
            <option value="new">최신순</option>
            <option value="popular">인기순</option>
        </select>
    </div>

    <div class="bl-list" id="list"></div>

</div>
<script type="module" src="/static/js/bl/home.js"></script>
</body>
</html>
