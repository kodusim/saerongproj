<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Work — saerong.com</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Noto Sans KR', sans-serif;
    background: #f2f4f7;
    color: #1a1a1a;
    height: 100vh;
    overflow: hidden;
}
.work-wrap {
    display: flex;
    height: 100vh;
}
/* ---------- 좌측 70% : 실시간 채팅 ---------- */
.chat-pane {
    flex: 0 0 70%;
    max-width: 70%;
    display: flex;
    flex-direction: column;
    background: #fff;
    border-right: 1px solid #e2e5ea;
}
.pane-header {
    padding: 14px 20px;
    background: #1B3A6B;
    color: #fff;
    font-weight: 700;
    font-size: 15px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}
.pane-header .nickname-box {
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: 400;
    font-size: 13px;
}
.pane-header input#nickname {
    width: 100px;
    padding: 4px 8px;
    border-radius: 6px;
    border: none;
    font-size: 13px;
}
.chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
}
.msg {
    max-width: 70%;
    padding: 8px 12px;
    border-radius: 12px;
    background: #eef1f6;
    font-size: 14px;
    line-height: 1.45;
    word-break: break-word;
}
.msg.mine {
    align-self: flex-end;
    background: #1B3A6B;
    color: #fff;
}
.msg .msg-meta {
    display: block;
    font-size: 11px;
    opacity: .65;
    margin-bottom: 3px;
}
.chat-empty {
    margin: auto;
    color: #9aa1ab;
    font-size: 13px;
}
.chat-input-row {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    border-top: 1px solid #e2e5ea;
    background: #fafbfc;
}
.chat-input-row input#chat-body {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid #d7dbe2;
    border-radius: 20px;
    font-size: 14px;
    outline: none;
}
.chat-input-row input#chat-body:focus { border-color: #1B3A6B; }
.chat-input-row button {
    padding: 0 20px;
    background: #1B3A6B;
    color: #fff;
    border: none;
    border-radius: 20px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
}
.chat-input-row button:hover { background: #16305a; }

/* ---------- 우측 30% : 구글 스칼라 검색 ---------- */
.scholar-pane {
    flex: 0 0 30%;
    max-width: 30%;
    display: flex;
    flex-direction: column;
    background: #f9fafb;
}
.scholar-search-row {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    border-bottom: 1px solid #e2e5ea;
    background: #fff;
}
.scholar-search-row input#scholar-q {
    flex: 1;
    padding: 9px 12px;
    border: 1px solid #d7dbe2;
    border-radius: 8px;
    font-size: 13px;
    outline: none;
}
.scholar-search-row input#scholar-q:focus { border-color: #1B3A6B; }
.scholar-search-row button {
    padding: 0 14px;
    background: #1B3A6B;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
}
.scholar-results {
    flex: 1;
    overflow-y: auto;
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
}
.scholar-empty {
    margin: auto;
    color: #9aa1ab;
    font-size: 13px;
    text-align: center;
    line-height: 1.6;
}
.scholar-item {
    padding: 12px;
    background: #fff;
    border: 1px solid #e6e9ee;
    border-radius: 10px;
}
.scholar-item a.s-title {
    display: block;
    font-size: 13.5px;
    font-weight: 700;
    color: #1B3A6B;
    text-decoration: none;
    line-height: 1.4;
    margin-bottom: 4px;
}
.scholar-item a.s-title:hover { text-decoration: underline; }
.scholar-item .s-meta {
    font-size: 11.5px;
    color: #6b7280;
    margin-bottom: 6px;
}
.scholar-item .s-snippet {
    font-size: 12.5px;
    color: #40474f;
    line-height: 1.5;
    margin-bottom: 4px;
}
.scholar-item .s-cited {
    font-size: 11px;
    color: #1B3A6B;
}
.scholar-error {
    margin: auto;
    text-align: center;
    padding: 20px;
    color: #b3452c;
    font-size: 13px;
    line-height: 1.6;
}
.scholar-error a {
    display: inline-block;
    margin-top: 8px;
    color: #1B3A6B;
    font-weight: 700;
}
.scholar-loading {
    margin: auto;
    color: #9aa1ab;
    font-size: 13px;
}

/* ---------- 모바일 ---------- */
@media (max-width: 768px) {
    body { overflow: auto; height: auto; }
    .work-wrap { flex-direction: column; height: auto; }
    .chat-pane, .scholar-pane {
        flex: 1 1 auto;
        max-width: 100%;
    }
    .chat-pane { height: 70vh; }
    .scholar-pane { height: 70vh; border-top: 1px solid #e2e5ea; }
}
@media (max-width: 480px) {
    .msg { max-width: 85%; }
    .pane-header { flex-direction: column; align-items: flex-start; gap: 6px; }
}
</style>
</head>
<body>
<div class="work-wrap">

    <!-- 좌측 70% : 실시간 채팅 -->
    <div class="chat-pane">
        <div class="pane-header">
            <span>💬 실시간 채팅</span>
            <div class="nickname-box">
                <label for="nickname">닉네임</label>
                <input type="text" id="nickname" maxlength="16" placeholder="익명">
            </div>
        </div>
        <div class="chat-messages" id="chat-messages">
            <div class="chat-empty" id="chat-empty">아직 메시지가 없습니다. 첫 메시지를 남겨보세요.</div>
        </div>
        <div class="chat-input-row">
            <input type="text" id="chat-body" placeholder="메시지를 입력하세요" maxlength="2000">
            <button id="chat-send">전송</button>
        </div>
    </div>

    <!-- 우측 30% : 구글 스칼라 검색 -->
    <div class="scholar-pane">
        <div class="pane-header" style="background:#2c4a7c;">
            <span>🎓 Google Scholar</span>
        </div>
        <div class="scholar-search-row">
            <input type="text" id="scholar-q" placeholder="논문/키워드 검색">
            <button id="scholar-search">검색</button>
        </div>
        <div class="scholar-results" id="scholar-results">
            <div class="scholar-empty">검색어를 입력하면<br>구글 스칼라 결과가 여기에 표시됩니다.</div>
        </div>
    </div>

</div>

<script>
function getCookie(name) {
    const v = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
    return v ? decodeURIComponent(v.pop()) : '';
}
const CSRF_TOKEN = getCookie('csrftoken');

/* ---------------- 채팅 ---------------- */
const chatMessagesEl = document.getElementById('chat-messages');
const chatEmptyEl = document.getElementById('chat-empty');
const chatBodyEl = document.getElementById('chat-body');
const nicknameEl = document.getElementById('nickname');

nicknameEl.value = localStorage.getItem('work_nickname') || '';
nicknameEl.addEventListener('change', () => {
    localStorage.setItem('work_nickname', nicknameEl.value.trim());
});

let lastMessageId = 0;
let myNickname = () => (nicknameEl.value.trim() || '익명');

function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
}

function renderMessages(messages) {
    if (!messages.length) return;
    if (chatEmptyEl) chatEmptyEl.remove();
    const atBottom = chatMessagesEl.scrollHeight - chatMessagesEl.scrollTop - chatMessagesEl.clientHeight < 60;

    messages.forEach(m => {
        const div = document.createElement('div');
        const mine = m.sender_name === myNickname();
        div.className = 'msg' + (mine ? ' mine' : '');
        const time = new Date(m.created_at).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
        div.innerHTML = `<span class="msg-meta">${escapeHtml(m.sender_name)} · ${time}</span>${escapeHtml(m.body)}`;
        chatMessagesEl.appendChild(div);
        lastMessageId = Math.max(lastMessageId, m.id);
    });

    if (atBottom) chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
}

async function pollMessages() {
    try {
        const res = await fetch(`/work/api/messages/?after=${lastMessageId}`);
        if (!res.ok) return;
        const data = await res.json();
        renderMessages(data.messages || []);
    } catch (e) { /* 네트워크 일시 오류는 조용히 무시 — 다음 폴링에서 재시도 */ }
}

async function sendMessage() {
    const body = chatBodyEl.value.trim();
    if (!body) return;
    chatBodyEl.value = '';
    try {
        const res = await fetch('/work/api/send/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': CSRF_TOKEN },
            body: JSON.stringify({ sender_name: myNickname(), body }),
        });
        if (res.ok) await pollMessages();
    } catch (e) { /* no-op */ }
}

document.getElementById('chat-send').addEventListener('click', sendMessage);
chatBodyEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendMessage();
});

pollMessages();
setInterval(pollMessages, 2000);

/* ---------------- 구글 스칼라 검색 ---------------- */
const scholarQEl = document.getElementById('scholar-q');
const scholarResultsEl = document.getElementById('scholar-results');

function renderScholarResults(data) {
    scholarResultsEl.innerHTML = '';

    if (data.error) {
        const div = document.createElement('div');
        div.className = 'scholar-error';
        div.innerHTML = `${escapeHtml(data.error)}` +
            (data.fallback_url ? `<br><a href="${data.fallback_url}" target="_blank" rel="noopener">Google Scholar에서 직접 열기 ↗</a>` : '');
        scholarResultsEl.appendChild(div);
        return;
    }

    const results = data.results || [];
    if (!results.length) {
        scholarResultsEl.innerHTML = '<div class="scholar-empty">검색 결과가 없습니다.</div>';
        return;
    }

    results.forEach(r => {
        const item = document.createElement('div');
        item.className = 'scholar-item';
        item.innerHTML = `
            <a class="s-title" href="${r.link || '#'}" target="_blank" rel="noopener">${escapeHtml(r.title)}</a>
            <div class="s-meta">${escapeHtml(r.meta || '')}</div>
            <div class="s-snippet">${escapeHtml(r.snippet || '')}</div>
            ${r.cited_by ? `<div class="s-cited">${escapeHtml(r.cited_by)}</div>` : ''}
        `;
        scholarResultsEl.appendChild(item);
    });
}

async function searchScholar() {
    const q = scholarQEl.value.trim();
    if (!q) return;
    scholarResultsEl.innerHTML = '<div class="scholar-loading">검색 중...</div>';
    try {
        const res = await fetch(`/work/api/scholar/?q=${encodeURIComponent(q)}`);
        const data = await res.json();
        renderScholarResults(data);
    } catch (e) {
        renderScholarResults({ error: '네트워크 오류가 발생했습니다.' });
    }
}

document.getElementById('scholar-search').addEventListener('click', searchScholar);
scholarQEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') searchScholar();
});
</script>
</body>
</html>
