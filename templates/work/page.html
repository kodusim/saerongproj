<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Work — saerong.com</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Noto Sans KR', sans-serif;
    background: #f2f4f7;
    color: #1a1a1a;
    height: 100vh;
    overflow: hidden;
}
.work-wrap {
    display: flex;
    height: 100vh;
}
/* ---------- 좌측 70% : 실시간 채팅 ---------- */
.chat-pane {
    flex: 0 0 70%;
    max-width: 70%;
    display: flex;
    flex-direction: column;
    background: #fff;
    border-right: 1px solid #e2e5ea;
}
.pane-header {
    padding: 14px 20px;
    background: #1B3A6B;
    color: #fff;
    font-weight: 700;
    font-size: 15px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}
.pane-header .nickname-box {
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: 400;
    font-size: 13px;
}
.pane-header input#nickname {
    width: 100px;
    padding: 4px 8px;
    border-radius: 6px;
    border: none;
    font-size: 13px;
}
.chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
}
.msg {
    max-width: 70%;
    padding: 8px 12px;
    border-radius: 12px;
    background: #eef1f6;
    font-size: 14px;
    line-height: 1.45;
    word-break: break-word;
}
.msg.mine {
    align-self: flex-end;
    background: #1B3A6B;
    color: #fff;
}
.msg .msg-meta {
    display: block;
    font-size: 11px;
    opacity: .65;
    margin-bottom: 3px;
}
.chat-empty {
    margin: auto;
    color: #9aa1ab;
    font-size: 13px;
}
.chat-input-row {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    border-top: 1px solid #e2e5ea;
    background: #fafbfc;
}
.chat-input-row input#chat-body {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid #d7dbe2;
    border-radius: 20px;
    font-size: 14px;
    outline: none;
}
.chat-input-row input#chat-body:focus { border-color: #1B3A6B; }
.chat-input-row button {
    padding: 0 20px;
    background: #1B3A6B;
    color: #fff;
    border: none;
    border-radius: 20px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
}
.chat-input-row button:hover { background: #16305a; }

/* ---------- 우측 30% : 구글 스칼라 검색 (실제 scholar.google.com 스타일) ---------- */
.scholar-pane {
    flex: 0 0 30%;
    max-width: 30%;
    display: flex;
    flex-direction: column;
    background: #fff;
    font-family: Arial, 'Noto Sans KR', sans-serif;
}
.scholar-topbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    border-bottom: 1px solid #e9eaed;
    color: #5f6368;
    font-size: 13px;
}
.scholar-topbar .s-menu-icon { font-size: 16px; color: #5f6368; }
.scholar-logo {
    font-size: 15px;
    font-weight: 500;
    letter-spacing: -.2px;
}
.scholar-logo b { font-weight: 700; }
.scholar-logo .g-blue { color: #4285F4; }
.scholar-logo .g-red { color: #EA4335; }
.scholar-logo .g-yellow { color: #FBBC05; }
.scholar-logo .g-green { color: #34A853; }
.scholar-logo .g-label { color: #5f6368; font-weight: 400; margin-left: 2px; }

.scholar-search-row {
    display: flex;
    padding: 10px 14px;
    border-bottom: 1px solid #e9eaed;
    background: #fff;
}
.scholar-search-pill {
    flex: 1;
    display: flex;
    align-items: center;
    border: 1px solid #dfe1e5;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(0,0,0,.04);
}
.scholar-search-pill input#scholar-q {
    flex: 1;
    border: none;
    outline: none;
    padding: 9px 14px;
    font-size: 13px;
    color: #202124;
}
.scholar-search-pill button {
    flex: 0 0 auto;
    width: 38px;
    height: 34px;
    margin-right: 2px;
    border: none;
    border-radius: 18px;
    background: #4285F4;
    color: #fff;
    font-size: 15px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
}
.scholar-search-pill button:hover { background: #3b78e0; }

.scholar-results {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
}
.scholar-stats {
    padding: 10px 14px 6px;
    font-size: 11.5px;
    color: #70757a;
}
.scholar-empty {
    margin: auto;
    color: #9aa1ab;
    font-size: 13px;
    text-align: center;
    line-height: 1.6;
    padding: 40px 20px;
}
.scholar-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 12px 14px;
    border-bottom: 1px solid #f1f2f4;
}
.scholar-item .s-main { flex: 1; min-width: 0; }
.scholar-item a.s-title,
.scholar-item a.s-title strong {
    font-size: 14px;
    font-weight: 400;
    color: #1a0dab;
    text-decoration: none;
    line-height: 1.35;
}
.scholar-item a.s-title:visited { color: #609; }
.scholar-item a.s-title:hover { text-decoration: underline; }
.scholar-item .s-meta {
    font-size: 12px;
    color: #4d5156;
    margin: 3px 0 5px;
    line-height: 1.4;
}
.scholar-item .s-meta a.s-author-link {
    color: #4d5156;
    text-decoration: underline;
}
.scholar-item .s-snippet {
    font-size: 12.5px;
    color: #4d5156;
    line-height: 1.5;
    margin-bottom: 6px;
}
.scholar-item .s-footer {
    font-size: 11px;
    color: #70757a;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px;
}
.scholar-item .s-footer a {
    color: #1a0dab;
    text-decoration: none;
}
.scholar-item .s-footer a:hover { text-decoration: underline; }
.scholar-item .s-footer .s-sep { color: #c7c9cc; margin: 0 2px; }
.scholar-item .s-source {
    flex: 0 0 84px;
    max-width: 84px;
    text-align: right;
    font-size: 11px;
    color: #4d5156;
    line-height: 1.35;
    word-break: break-word;
}
.scholar-item .s-source a { color: inherit; text-decoration: none; }
.scholar-item .s-source a:hover { text-decoration: underline; }
.scholar-item .s-source-label { font-weight: 700; }
.scholar-error {
    margin: auto;
    text-align: center;
    padding: 20px;
    color: #b3452c;
    font-size: 13px;
    line-height: 1.6;
}
.scholar-error a {
    display: inline-block;
    margin-top: 8px;
    color: #1a0dab;
    font-weight: 700;
}
.scholar-loading {
    margin: auto;
    color: #9aa1ab;
    font-size: 13px;
    padding: 40px 20px;
    text-align: center;
}

/* ---------- 모바일 ---------- */
@media (max-width: 768px) {
    body { overflow: auto; height: auto; }
    .work-wrap { flex-direction: column; height: auto; }
    .chat-pane, .scholar-pane {
        flex: 1 1 auto;
        max-width: 100%;
    }
    .chat-pane { height: 70vh; }
    .scholar-pane { height: 70vh; border-top: 1px solid #e2e5ea; }
}
@media (max-width: 480px) {
    .msg { max-width: 85%; }
    .pane-header { flex-direction: column; align-items: flex-start; gap: 6px; }
}
</style>
</head>
<body>
<div class="work-wrap">

    <!-- 좌측 70% : 실시간 채팅 -->
    <div class="chat-pane">
        <div class="pane-header">
            <span>💬 실시간 채팅</span>
            <div class="nickname-box">
                <label for="nickname">닉네임</label>
                <input type="text" id="nickname" maxlength="16" placeholder="익명">
            </div>
        </div>
        <div class="chat-messages" id="chat-messages">
            <div class="chat-empty" id="chat-empty">아직 메시지가 없습니다. 첫 메시지를 남겨보세요.</div>
        </div>
        <div class="chat-input-row">
            <input type="text" id="chat-body" placeholder="메시지를 입력하세요" maxlength="2000">
            <button id="chat-send">전송</button>
        </div>
    </div>

    <!-- 우측 30% : 구글 스칼라 검색 -->
    <div class="scholar-pane">
        <div class="scholar-topbar">
            <span class="s-menu-icon">☰</span>
            <span class="scholar-logo">
                <b><span class="g-blue">G</span><span class="g-red">o</span><span class="g-yellow">o</span><span class="g-blue">g</span><span class="g-green">l</span><span class="g-red">e</span></b>
                <span class="g-label">학술검색</span>
            </span>
        </div>
        <div class="scholar-search-row">
            <div class="scholar-search-pill">
                <input type="text" id="scholar-q" placeholder="논문/키워드 검색">
                <button id="scholar-search" aria-label="검색">🔍</button>
            </div>
        </div>
        <div class="scholar-results" id="scholar-results">
            <div class="scholar-empty">검색어를 입력하면<br>구글 스칼라 결과가 여기에 표시됩니다.</div>
        </div>
    </div>

</div>

<script>
function getCookie(name) {
    const v = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
    return v ? decodeURIComponent(v.pop()) : '';
}
const CSRF_TOKEN = getCookie('csrftoken');

/* ---------------- 채팅 ---------------- */
const chatMessagesEl = document.getElementById('chat-messages');
const chatEmptyEl = document.getElementById('chat-empty');
const chatBodyEl = document.getElementById('chat-body');
const nicknameEl = document.getElementById('nickname');

nicknameEl.value = localStorage.getItem('work_nickname') || '';
nicknameEl.addEventListener('change', () => {
    localStorage.setItem('work_nickname', nicknameEl.value.trim());
});

let lastMessageId = 0;
let myNickname = () => (nicknameEl.value.trim() || '익명');

function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
}

function renderMessages(messages) {
    if (!messages.length) return;
    if (chatEmptyEl) chatEmptyEl.remove();
    const atBottom = chatMessagesEl.scrollHeight - chatMessagesEl.scrollTop - chatMessagesEl.clientHeight < 60;

    messages.forEach(m => {
        const div = document.createElement('div');
        const mine = m.sender_name === myNickname();
        div.className = 'msg' + (mine ? ' mine' : '');
        const time = new Date(m.created_at).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
        div.innerHTML = `<span class="msg-meta">${escapeHtml(m.sender_name)} · ${time}</span>${escapeHtml(m.body)}`;
        chatMessagesEl.appendChild(div);
        lastMessageId = Math.max(lastMessageId, m.id);
    });

    if (atBottom) chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
}

async function pollMessages() {
    try {
        const res = await fetch(`/work/api/messages/?after=${lastMessageId}`);
        if (!res.ok) return;
        const data = await res.json();
        renderMessages(data.messages || []);
    } catch (e) { /* 네트워크 일시 오류는 조용히 무시 — 다음 폴링에서 재시도 */ }
}

async function sendMessage() {
    const body = chatBodyEl.value.trim();
    if (!body) return;
    chatBodyEl.value = '';
    try {
        const res = await fetch('/work/api/send/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': CSRF_TOKEN },
            body: JSON.stringify({ sender_name: myNickname(), body }),
        });
        if (res.ok) await pollMessages();
    } catch (e) { /* no-op */ }
}

document.getElementById('chat-send').addEventListener('click', sendMessage);
chatBodyEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendMessage();
});

pollMessages();
setInterval(pollMessages, 2000);

/* ---------------- 구글 스칼라 검색 ---------------- */
const scholarQEl = document.getElementById('scholar-q');
const scholarResultsEl = document.getElementById('scholar-results');

function renderScholarResults(data) {
    scholarResultsEl.innerHTML = '';

    if (data.error) {
        const div = document.createElement('div');
        div.className = 'scholar-error';
        div.innerHTML = `${escapeHtml(data.error)}` +
            (data.fallback_url ? `<br><a href="${data.fallback_url}" target="_blank" rel="noopener">Google Scholar에서 직접 열기 ↗</a>` : '');
        scholarResultsEl.appendChild(div);
        return;
    }

    const results = data.results || [];

    if (data.stats) {
        const stats = document.createElement('div');
        stats.className = 'scholar-stats';
        stats.textContent = data.stats;
        scholarResultsEl.appendChild(stats);
    }

    if (!results.length) {
        scholarResultsEl.insertAdjacentHTML('beforeend', '<div class="scholar-empty">검색 결과가 없습니다.</div>');
        return;
    }

    results.forEach(r => {
        const item = document.createElement('div');
        item.className = 'scholar-item';

        const sourceBadge = r.source_site ? `
            <div class="s-source">${
                r.source_link ? `<a href="${r.source_link}" target="_blank" rel="noopener">` : ''
            }${r.source_label ? `<span class="s-source-label">${escapeHtml(r.source_label)}</span> ` : ''}${escapeHtml(r.source_site)}${
                r.source_link ? '</a>' : ''
            }</div>` : '';

        const footer = (r.footer_links || [])
            .map(f => `<a href="${f.url}" target="_blank" rel="noopener">${escapeHtml(f.text)}</a>`)
            .join('<span class="s-sep">·</span>');

        item.innerHTML = `
            <div class="s-main">
                <a class="s-title" href="${r.link || '#'}" target="_blank" rel="noopener">${r.title_html}</a>
                <div class="s-meta">${r.meta_html}</div>
                <div class="s-snippet">${r.snippet_html}</div>
                <div class="s-footer">
                    <span>☆ 저장</span>
                    ${footer ? `<span class="s-sep">·</span>${footer}` : ''}
                </div>
            </div>
            ${sourceBadge}
        `;
        scholarResultsEl.appendChild(item);
    });
}

async function searchScholar() {
    const q = scholarQEl.value.trim();
    if (!q) return;
    scholarResultsEl.innerHTML = '<div class="scholar-loading">검색 중...</div>';
    try {
        const res = await fetch(`/work/api/scholar/?q=${encodeURIComponent(q)}`);
        const data = await res.json();
        renderScholarResults(data);
    } catch (e) {
        renderScholarResults({ error: '네트워크 오류가 발생했습니다.' });
    }
}

document.getElementById('scholar-search').addEventListener('click', searchScholar);
scholarQEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') searchScholar();
});
</script>
</body>
</html>
