<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Work — saerong.com</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Noto Sans KR', sans-serif;
    background: #f2f4f7;
    color: #1a1a1a;
    height: 100vh;
    overflow: hidden;
}
.work-wrap {
    display: flex;
    height: 100vh;
}
/* ---------- 좌측 : 채팅 기록보관함 (전자문서함 스타일) ---------- */
.chat-pane {
    flex: 0 0 70%;
    max-width: 70%;
    display: flex;
    flex-direction: column;
    background: #fff;
    min-width: 0;
}
.doc-topbar {
    padding: 11px 18px;
    background: linear-gradient(135deg, #16305a, #1B3A6B);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: space-between;
}
.doc-topbar .doc-title {
    font-weight: 700;
    font-size: 14.5px;
    display: flex;
    align-items: center;
    gap: 6px;
}
.doc-topbar .doc-count {
    font-weight: 400;
    font-size: 12px;
    opacity: .75;
    margin-left: 2px;
}
.doc-topbar .nickname-box {
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: 400;
    font-size: 12.5px;
}
.doc-topbar input#nickname {
    width: 96px;
    padding: 4px 8px;
    border-radius: 3px;
    border: none;
    font-size: 12.5px;
}
.doc-filter-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 18px;
    background: #f5f7fa;
    border-bottom: 1px solid #dde2e8;
}
.doc-filter-row input#msg-search {
    flex: 0 1 240px;
    padding: 6px 10px;
    border: 1px solid #d3d8de;
    border-radius: 3px;
    font-size: 12px;
    outline: none;
}
.doc-filter-row input#msg-search:focus { border-color: #1B3A6B; }
.doc-filter-row .doc-refresh {
    cursor: pointer;
    color: #1B3A6B;
    font-size: 12px;
    font-weight: 700;
    user-select: none;
}
.doc-filter-row .doc-refresh:hover { text-decoration: underline; }

.chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: #eef1f5;
}
.chat-empty {
    margin: auto;
    color: #9aa1ab;
    font-size: 13px;
    text-align: center;
}

/* 문서 카드형 메시지 — 말풍선 대신 결재문서 카드 스타일 */
.msg-card {
    max-width: 76%;
    align-self: flex-start;
    background: #fff;
    border: 1px solid #d8dde3;
    border-left: 3px solid #9aa5b1;
    border-radius: 2px;
    padding: 7px 12px 8px;
}
.msg-card.mine {
    align-self: flex-end;
    text-align: right;
    border-left: 1px solid #d8dde3;
    border-right: 3px solid #2f6fed;
}
.msg-card .msg-head {
    display: flex;
    align-items: center;
    gap: 5px;
    font-family: Consolas, 'Courier New', monospace;
    font-size: 10.5px;
    color: #8a92a0;
    margin-bottom: 4px;
}
.msg-card.mine .msg-head { justify-content: flex-end; }
.msg-card .msg-head .doc-no { color: #1B3A6B; font-weight: 700; }
.msg-card .msg-body {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 13px;
    color: #232427;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
}
.msg-card .msg-image-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    margin-top: 5px;
    padding: 4px 10px;
    background: #eef1f5;
    border: 1px solid #dde2e8;
    border-radius: 3px;
    font-size: 11.5px;
    color: #1B3A6B;
    cursor: pointer;
}
.msg-card .msg-image-chip:hover { background: #e4e9f0; }

.chat-input-area {
    border-top: 1px solid #e2e5ea;
    background: #fafbfc;
    padding: 8px 16px;
}
.pending-attachment {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    margin-bottom: 6px;
    background: #eef1f5;
    border: 1px solid #dde2e8;
    border-radius: 4px;
    font-size: 12px;
    color: #1B3A6B;
}
.pending-attachment span { flex: 1; }
.pending-attachment button {
    border: none;
    background: none;
    cursor: pointer;
    color: #8a92a0;
    font-size: 13px;
}
.chat-input-row {
    display: flex;
    align-items: flex-end;
    gap: 8px;
}
.chat-input-row .icon-btn {
    flex: 0 0 auto;
    width: 36px;
    height: 36px;
    border: 1px solid #d7dbe2;
    background: #fff;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
}
.chat-input-row .icon-btn:hover { background: #f0f2f5; }
.chat-input-row textarea#chat-body {
    flex: 1;
    resize: none;
    max-height: 120px;
    overflow-y: auto;
    padding: 9px 14px;
    border: 1px solid #d7dbe2;
    border-radius: 18px;
    font-size: 14px;
    font-family: inherit;
    line-height: 1.4;
    outline: none;
}
.chat-input-row textarea#chat-body:focus { border-color: #1B3A6B; }
.chat-input-row button#chat-send {
    flex: 0 0 auto;
    height: 36px;
    padding: 0 20px;
    background: #1B3A6B;
    color: #fff;
    border: none;
    border-radius: 18px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
}
.chat-input-row button#chat-send:hover { background: #16305a; }

/* ---------- 리사이즈 핸들 ---------- */
.resize-handle {
    flex: 0 0 6px;
    background: #e2e5ea;
    cursor: col-resize;
    position: relative;
}
.resize-handle:hover, .resize-handle.dragging { background: #9fb3d9; }
.resize-handle::after {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 2px; height: 28px;
    background: #c3c9d1;
    border-radius: 2px;
}

/* ---------- 이미지 라이트박스 ---------- */
.img-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.82);
    z-index: 999;
    align-items: center;
    justify-content: center;
}
.img-modal.open { display: flex; }
.img-modal img {
    max-width: 90vw;
    max-height: 88vh;
    border-radius: 4px;
    box-shadow: 0 10px 40px rgba(0,0,0,.4);
}
.img-modal-close {
    position: absolute;
    top: 18px; right: 24px;
    width: 36px; height: 36px;
    border-radius: 50%;
    background: rgba(255,255,255,.15);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    cursor: pointer;
}
.img-modal-close:hover { background: rgba(255,255,255,.3); }

/* ---------- 우측 : 구글 스칼라 검색 (실제 scholar.google.com 스타일) ---------- */
.scholar-pane {
    flex: 0 0 30%;
    max-width: 30%;
    min-width: 0;
    display: flex;
    flex-direction: column;
    background: #fff;
    font-family: Arial, 'Noto Sans KR', sans-serif;
}
.scholar-topbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    border-bottom: 1px solid #e9eaed;
    color: #5f6368;
    font-size: 13px;
}
.scholar-topbar .s-menu-icon { font-size: 16px; color: #5f6368; }
.scholar-logo {
    font-size: 15px;
    font-weight: 500;
    letter-spacing: -.2px;
}
.scholar-logo b { font-weight: 700; }
.scholar-logo .g-blue { color: #4285F4; }
.scholar-logo .g-red { color: #EA4335; }
.scholar-logo .g-yellow { color: #FBBC05; }
.scholar-logo .g-green { color: #34A853; }
.scholar-logo .g-label { color: #5f6368; font-weight: 400; margin-left: 2px; }

.scholar-search-row {
    display: flex;
    padding: 10px 14px;
    border-bottom: 1px solid #e9eaed;
    background: #fff;
}
.scholar-search-pill {
    flex: 1;
    display: flex;
    align-items: center;
    border: 1px solid #dfe1e5;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(0,0,0,.04);
}
.scholar-search-pill input#scholar-q {
    flex: 1;
    border: none;
    outline: none;
    padding: 9px 14px;
    font-size: 13px;
    color: #202124;
}
.scholar-search-pill button {
    flex: 0 0 auto;
    width: 38px;
    height: 34px;
    margin-right: 2px;
    border: none;
    border-radius: 18px;
    background: #4285F4;
    color: #fff;
    font-size: 15px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
}
.scholar-search-pill button:hover { background: #3b78e0; }

.scholar-results {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
}
.scholar-stats {
    padding: 10px 14px 6px;
    font-size: 11.5px;
    color: #70757a;
}
.scholar-empty {
    margin: auto;
    color: #9aa1ab;
    font-size: 13px;
    text-align: center;
    line-height: 1.6;
    padding: 40px 20px;
}
.scholar-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 12px 14px;
    border-bottom: 1px solid #f1f2f4;
}
.scholar-item .s-main { flex: 1; min-width: 0; }
.scholar-item a.s-title,
.scholar-item a.s-title strong {
    font-size: 14px;
    font-weight: 400;
    color: #1a0dab;
    text-decoration: none;
    line-height: 1.35;
}
.scholar-item a.s-title:visited { color: #609; }
.scholar-item a.s-title:hover { text-decoration: underline; }
.scholar-item .s-meta {
    font-size: 12px;
    color: #4d5156;
    margin: 3px 0 5px;
    line-height: 1.4;
}
.scholar-item .s-meta a.s-author-link {
    color: #4d5156;
    text-decoration: underline;
}
.scholar-item .s-snippet {
    font-size: 12.5px;
    color: #4d5156;
    line-height: 1.5;
    margin-bottom: 6px;
}
.scholar-item .s-footer {
    font-size: 11px;
    color: #70757a;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px;
}
.scholar-item .s-footer a {
    color: #1a0dab;
    text-decoration: none;
}
.scholar-item .s-footer a:hover { text-decoration: underline; }
.scholar-item .s-footer .s-sep { color: #c7c9cc; margin: 0 2px; }
.scholar-item .s-source {
    flex: 0 0 84px;
    max-width: 84px;
    text-align: right;
    font-size: 11px;
    color: #4d5156;
    line-height: 1.35;
    word-break: break-word;
}
.scholar-item .s-source a { color: inherit; text-decoration: none; }
.scholar-item .s-source a:hover { text-decoration: underline; }
.scholar-item .s-source-label { font-weight: 700; }
.scholar-error {
    margin: auto;
    text-align: center;
    padding: 20px;
    color: #b3452c;
    font-size: 13px;
    line-height: 1.6;
}
.scholar-error a {
    display: inline-block;
    margin-top: 8px;
    color: #1a0dab;
    font-weight: 700;
}
.scholar-loading {
    margin: auto;
    color: #9aa1ab;
    font-size: 13px;
    padding: 40px 20px;
    text-align: center;
}

/* ---------- 모바일 ---------- */
@media (max-width: 768px) {
    body { overflow: auto; height: auto; }
    .work-wrap { flex-direction: column; height: auto; }
    .chat-pane, .scholar-pane {
        flex: 1 1 auto !important;
        max-width: 100% !important;
    }
    .chat-pane { height: 70vh; }
    .scholar-pane { height: 70vh; border-top: 1px solid #e2e5ea; }
    .resize-handle { display: none; }
}
@media (max-width: 480px) {
    .msg-card { max-width: 88%; }
    .doc-topbar { flex-direction: column; align-items: flex-start; gap: 6px; }
}
</style>
</head>
<body>
<div class="work-wrap">

    <!-- 좌측 : 채팅 기록보관함 -->
    <div class="chat-pane" id="chat-pane">
        <div class="doc-topbar">
            <span class="doc-title">📁 채팅 기록보관함<span class="doc-count" id="doc-count"></span></span>
            <div class="nickname-box">
                <label for="nickname">닉네임</label>
                <input type="text" id="nickname" maxlength="16" placeholder="익명">
            </div>
        </div>
        <div class="doc-filter-row">
            <input type="text" id="msg-search" placeholder="내용/작성자 검색">
            <span class="doc-refresh" id="doc-refresh">⟳ 새로고침</span>
        </div>
        <div class="chat-messages" id="chat-messages">
            <div class="chat-empty">아직 메시지가 없습니다. 첫 메시지를 남겨보세요.</div>
        </div>
        <div class="chat-input-area">
            <div class="pending-attachment" id="pending-attachment" hidden>
                <span id="pending-attachment-name"></span>
                <button id="pending-attachment-remove" type="button">✕</button>
            </div>
            <div class="chat-input-row">
                <button id="attach-btn" class="icon-btn" type="button" title="이미지 첨부">📷</button>
                <input type="file" id="attach-file" accept="image/*" hidden>
                <textarea id="chat-body" rows="1" placeholder="메시지를 입력하세요 (Shift+Enter 줄바꿈)" maxlength="2000"></textarea>
                <button id="chat-send" type="button">전송</button>
            </div>
        </div>
    </div>

    <div class="resize-handle" id="resize-handle"></div>

    <!-- 우측 : 구글 스칼라 검색 -->
    <div class="scholar-pane" id="scholar-pane">
        <div class="scholar-topbar">
            <span class="s-menu-icon">☰</span>
            <span class="scholar-logo">
                <b><span class="g-blue">G</span><span class="g-red">o</span><span class="g-yellow">o</span><span class="g-blue">g</span><span class="g-green">l</span><span class="g-red">e</span></b>
                <span class="g-label">학술검색</span>
            </span>
        </div>
        <div class="scholar-search-row">
            <div class="scholar-search-pill">
                <input type="text" id="scholar-q" placeholder="논문/키워드 검색">
                <button id="scholar-search" aria-label="검색">🔍</button>
            </div>
        </div>
        <div class="scholar-results" id="scholar-results">
            <div class="scholar-empty">검색어를 입력하면<br>구글 스칼라 결과가 여기에 표시됩니다.</div>
        </div>
    </div>

</div>

<!-- 이미지 라이트박스 -->
<div class="img-modal" id="img-modal">
    <div class="img-modal-close" id="img-modal-close">✕</div>
    <img id="img-modal-img" src="" alt="첨부 이미지">
</div>

<script>
function getCookie(name) {
    const v = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
    return v ? decodeURIComponent(v.pop()) : '';
}
const CSRF_TOKEN = getCookie('csrftoken');

function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s == null ? '' : s;
    return d.innerHTML;
}

/* ---------------- 좌/우 패널 리사이즈 ---------------- */
const workWrap = document.querySelector('.work-wrap');
const chatPane = document.getElementById('chat-pane');
const scholarPane = document.getElementById('scholar-pane');
const resizeHandle = document.getElementById('resize-handle');
let resizing = false;

resizeHandle.addEventListener('mousedown', () => {
    resizing = true;
    resizeHandle.classList.add('dragging');
    document.body.style.userSelect = 'none';
});
document.addEventListener('mousemove', (e) => {
    if (!resizing) return;
    const rect = workWrap.getBoundingClientRect();
    let pct = ((e.clientX - rect.left) / rect.width) * 100;
    pct = Math.min(80, Math.max(20, pct));
    chatPane.style.flex = `0 0 ${pct}%`;
    chatPane.style.maxWidth = `${pct}%`;
    scholarPane.style.flex = `0 0 ${100 - pct}%`;
    scholarPane.style.maxWidth = `${100 - pct}%`;
});
document.addEventListener('mouseup', () => {
    if (!resizing) return;
    resizing = false;
    resizeHandle.classList.remove('dragging');
    document.body.style.userSelect = '';
});

/* ---------------- 이미지 라이트박스 ---------------- */
const imgModal = document.getElementById('img-modal');
const imgModalImg = document.getElementById('img-modal-img');
function openImageModal(url) {
    imgModalImg.src = url;
    imgModal.classList.add('open');
}
function closeImageModal() {
    imgModal.classList.remove('open');
    imgModalImg.src = '';
}
document.getElementById('img-modal-close').addEventListener('click', closeImageModal);
imgModal.addEventListener('click', (e) => { if (e.target === imgModal) closeImageModal(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeImageModal(); });

/* ---------------- 채팅 ---------------- */
const chatMessagesEl = document.getElementById('chat-messages');
const chatBodyEl = document.getElementById('chat-body');
const nicknameEl = document.getElementById('nickname');
const msgSearchEl = document.getElementById('msg-search');
const docCountEl = document.getElementById('doc-count');
const attachBtn = document.getElementById('attach-btn');
const attachFileEl = document.getElementById('attach-file');
const pendingBox = document.getElementById('pending-attachment');
const pendingName = document.getElementById('pending-attachment-name');

nicknameEl.value = localStorage.getItem('work_nickname') || '';
nicknameEl.addEventListener('change', () => {
    localStorage.setItem('work_nickname', nicknameEl.value.trim());
});
let myNickname = () => (nicknameEl.value.trim() || '익명');

let allMessages = [];
let lastMessageId = 0;
let pendingImageFile = null;

function formatDate(iso) {
    const d = new Date(iso);
    return d.toLocaleString('ko-KR', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
}

function renderMessageList() {
    const q = (msgSearchEl.value || '').trim().toLowerCase();
    const filtered = q
        ? allMessages.filter(m => (m.body || '').toLowerCase().includes(q) || m.sender_name.toLowerCase().includes(q))
        : allMessages;

    docCountEl.textContent = `(${allMessages.length})`;

    const atBottom = chatMessagesEl.scrollHeight - chatMessagesEl.scrollTop - chatMessagesEl.clientHeight < 80;

    if (!filtered.length) {
        chatMessagesEl.innerHTML = `<div class="chat-empty">${q ? '검색 결과가 없습니다.' : '아직 메시지가 없습니다. 첫 메시지를 남겨보세요.'}</div>`;
        return;
    }

    chatMessagesEl.innerHTML = filtered.map(m => {
        const docNo = `WORK-${m.id}`;
        const date = formatDate(m.created_at);
        const metaParts = m.mine
            ? [`<span>${date}</span>`, `<span>${escapeHtml(m.sender_name)}</span>`, `<span class="doc-no">${docNo}</span>`]
            : [`<span class="doc-no">${docNo}</span>`, `<span>${escapeHtml(m.sender_name)}</span>`, `<span>${date}</span>`];
        const bodyHtml = m.body ? `<div class="msg-body">${escapeHtml(m.body)}</div>` : '';
        const imageChip = m.image_url
            ? `<div class="msg-image-chip" data-url="${escapeHtml(m.image_url)}">🖼 첨부 이미지</div>`
            : '';
        return `
            <div class="msg-card${m.mine ? ' mine' : ''}">
                <div class="msg-head">${metaParts.join('<span>·</span>')}</div>
                ${bodyHtml}
                ${imageChip}
            </div>
        `;
    }).join('');

    if (atBottom) chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
}

chatMessagesEl.addEventListener('click', (e) => {
    const chip = e.target.closest('.msg-image-chip');
    if (chip) openImageModal(chip.dataset.url);
});
msgSearchEl.addEventListener('input', renderMessageList);

async function pollMessages() {
    try {
        const res = await fetch(`/work/api/messages/?after=${lastMessageId}`);
        if (!res.ok) return;
        const data = await res.json();
        const msgs = data.messages || [];
        if (!msgs.length) return;
        allMessages = allMessages.concat(msgs);
        msgs.forEach(m => { lastMessageId = Math.max(lastMessageId, m.id); });
        renderMessageList();
    } catch (e) { /* 네트워크 일시 오류는 조용히 무시 — 다음 폴링에서 재시도 */ }
}
document.getElementById('doc-refresh').addEventListener('click', pollMessages);

/* 첨부 이미지 선택 */
attachBtn.addEventListener('click', () => attachFileEl.click());
attachFileEl.addEventListener('change', () => {
    const f = attachFileEl.files[0];
    if (!f) return;
    if (!f.type.startsWith('image/')) {
        alert('이미지 파일만 첨부할 수 있습니다.');
        attachFileEl.value = '';
        return;
    }
    if (f.size > 8 * 1024 * 1024) {
        alert('이미지는 8MB 이하만 첨부할 수 있습니다.');
        attachFileEl.value = '';
        return;
    }
    pendingImageFile = f;
    pendingName.textContent = `🖼 ${f.name}`;
    pendingBox.hidden = false;
});
document.getElementById('pending-attachment-remove').addEventListener('click', () => {
    pendingImageFile = null;
    attachFileEl.value = '';
    pendingBox.hidden = true;
});

/* 자동 줄높이 + Shift+Enter 줄바꿈 / Enter 전송 */
chatBodyEl.addEventListener('input', () => {
    chatBodyEl.style.height = 'auto';
    chatBodyEl.style.height = Math.min(chatBodyEl.scrollHeight, 120) + 'px';
});
chatBodyEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
});

async function sendMessage() {
    const body = chatBodyEl.value.trim();
    if (!body && !pendingImageFile) return;

    const fd = new FormData();
    fd.append('sender_name', myNickname());
    fd.append('body', body);
    if (pendingImageFile) fd.append('image', pendingImageFile);

    chatBodyEl.value = '';
    chatBodyEl.style.height = 'auto';
    pendingImageFile = null;
    attachFileEl.value = '';
    pendingBox.hidden = true;

    try {
        const res = await fetch('/work/api/send/', {
            method: 'POST',
            headers: { 'X-CSRFToken': CSRF_TOKEN },
            body: fd,
        });
        if (res.ok) {
            await pollMessages();
        } else {
            const data = await res.json().catch(() => ({}));
            if (data.error) alert(data.error);
        }
    } catch (e) { /* no-op */ }
}
document.getElementById('chat-send').addEventListener('click', sendMessage);

pollMessages();
setInterval(pollMessages, 2000);

/* ---------------- 구글 스칼라 검색 ---------------- */
const scholarQEl = document.getElementById('scholar-q');
const scholarResultsEl = document.getElementById('scholar-results');

function renderScholarResults(data) {
    scholarResultsEl.innerHTML = '';

    if (data.error) {
        const div = document.createElement('div');
        div.className = 'scholar-error';
        div.innerHTML = `${escapeHtml(data.error)}` +
            (data.fallback_url ? `<br><a href="${data.fallback_url}" target="_blank" rel="noopener">Google Scholar에서 직접 열기 ↗</a>` : '');
        scholarResultsEl.appendChild(div);
        return;
    }

    const results = data.results || [];

    if (data.stats) {
        const stats = document.createElement('div');
        stats.className = 'scholar-stats';
        stats.textContent = data.stats;
        scholarResultsEl.appendChild(stats);
    }

    if (!results.length) {
        scholarResultsEl.insertAdjacentHTML('beforeend', '<div class="scholar-empty">검색 결과가 없습니다.</div>');
        return;
    }

    results.forEach(r => {
        const item = document.createElement('div');
        item.className = 'scholar-item';

        const sourceBadge = r.source_site ? `
            <div class="s-source">${
                r.source_link ? `<a href="${r.source_link}" target="_blank" rel="noopener">` : ''
            }${r.source_label ? `<span class="s-source-label">${escapeHtml(r.source_label)}</span> ` : ''}${escapeHtml(r.source_site)}${
                r.source_link ? '</a>' : ''
            }</div>` : '';

        const footer = (r.footer_links || [])
            .map(f => `<a href="${f.url}" target="_blank" rel="noopener">${escapeHtml(f.text)}</a>`)
            .join('<span class="s-sep">·</span>');

        item.innerHTML = `
            <div class="s-main">
                <a class="s-title" href="${r.link || '#'}" target="_blank" rel="noopener">${r.title_html}</a>
                <div class="s-meta">${r.meta_html}</div>
                <div class="s-snippet">${r.snippet_html}</div>
                <div class="s-footer">
                    <span>☆ 저장</span>
                    ${footer ? `<span class="s-sep">·</span>${footer}` : ''}
                </div>
            </div>
            ${sourceBadge}
        `;
        scholarResultsEl.appendChild(item);
    });
}

async function searchScholar() {
    const q = scholarQEl.value.trim();
    if (!q) return;
    scholarResultsEl.innerHTML = '<div class="scholar-loading">검색 중...</div>';
    try {
        const res = await fetch(`/work/api/scholar/?q=${encodeURIComponent(q)}`);
        const data = await res.json();
        renderScholarResults(data);
    } catch (e) {
        renderScholarResults({ error: '네트워크 오류가 발생했습니다.' });
    }
}

document.getElementById('scholar-search').addEventListener('click', searchScholar);
scholarQEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') searchScholar();
});
</script>
</body>
